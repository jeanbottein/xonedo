# The kernel's mt76x2u lists the OLD dongle (045e:02e6) too. Left to autoload, it
# takes that dongle (as a Wi-Fi adapter with MediaTek's firmware) before
# xone_dongle, and unbinding it afterwards kills the dongle until a replug
# (tested 2026-11). So don't autoload it; install/mtnet loads it explicitly when
# a NEW dongle (045e:02fe) is plugged in.
blacklist mt76x2u
