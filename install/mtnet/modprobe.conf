# Installed as /etc/modprobe.d/xone-blacklist.conf, replacing install/modprobe.conf.
#
# The kernel's mt76x2u lists the OLD dongle (045e:02e6) too. Left to autoload, it
# takes that dongle (as a Wi-Fi adapter with MediaTek's firmware) before
# xone_dongle, and unbinding it afterwards kills the dongle until a replug
# (tested 2026-11). 70-xone-mtnet.rules loads it for the NEW dongle (045e:02fe).
blacklist mt76x2u
# xpad is not blacklisted: this tree has no xone_wired, so xpad is what drives
# wired Xbox controllers.
# xone_dongle is not blacklisted: it no longer claims the new dongle (045e:02fe),
# which runs on mt76x2u and xone_mtnet, and it is still needed for the old and
# built-in dongles.
